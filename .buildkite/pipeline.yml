# Buildkite CI for e2b-infra-dashboard
# Mirrors .github/workflows/{code-quality,test}.yml.
# Runs every step inside the pinned oven/bun image via the Docker plugin, so
# agents need only Docker — no host Bun/Node toolchain.
#
# Bun's global install cache is persisted on the agent host under
# /var/cache/buildkite-bun and mounted into each container, giving the same
# speedup as the GitHub Actions bun-cache step.

env:
  # Match GitHub Actions: force colored tool output in CI logs.
  FORCE_COLOR: "1"
  CLICOLOR_FORCE: "1"
  BUN_VERSION: "1.2.20"

# Anchors shared by every step.
common: &docker
  plugins:
    - docker#v5.11.0:
        image: "oven/bun:1.2.20"
        # Persist Bun's install cache across builds (equivalent to actions/cache).
        volumes:
          - "/var/cache/buildkite-bun:/root/.bun/install/cache"
        environment:
          - "FORCE_COLOR"
          - "CLICOLOR_FORCE"
        # Container-friendly bun install lives in the checkout mount.
        workdir: /workdir
        mount-checkout: true
        propagate-environment: true

steps:
  - group: ":lint-roller: Code Quality"
    key: quality
    steps:
      - label: ":biome: Lint"
        key: lint
        command:
          - "bun install --frozen-lockfile"
          - "bunx biome ci --formatter-enabled=false --linter-enabled=true --reporter=github ."
        <<: *docker

      - label: ":scissors: Knip"
        key: knip
        command:
          - "bun install --frozen-lockfile"
          - "bun run knip:ci"
        <<: *docker

  - group: ":vitest: Tests"
    key: tests
    steps:
      - label: ":microscope: Unit Tests"
        key: unit
        command:
          - "bun install --frozen-lockfile"
          - "bun run test:unit"
        <<: *docker

      - label: ":link: Integration Tests"
        key: integration
        depends_on: unit
        env:
          E2B_SESSION_SECRET: test-session-secret
          ORY_SDK_URL: https://test-ory.projects.oryapis.com
          ORY_OAUTH2_CLIENT_ID: test-ory-client-id
          ORY_OAUTH2_CLIENT_SECRET: test-ory-client-secret
          ORY_OAUTH2_CLI_CLIENT_ID: test-ory-cli-client-id
          ORY_OAUTH2_AUDIENCE: https://api.e2b-test.dev
          ORY_PROJECT_API_TOKEN: test-ory-project-api-token
          DASHBOARD_API_ADMIN_TOKEN: test-dashboard-admin-token
          BILLING_API_URL: https://billing.e2b-test.dev
          NEXT_PUBLIC_E2B_DOMAIN: e2b-test.dev
          NEXT_PUBLIC_POSTHOG_KEY: test-posthog-key
          NEXT_PUBLIC_STRIPE_BILLING_URL: https://test-stripe-billing.example.com
          NEXT_PUBLIC_SCAN: "0"
          NEXT_PUBLIC_MOCK_DATA: "1"
        command:
          - "bun install --frozen-lockfile"
          - "bun run test:integration"
        plugins:
          - docker#v5.11.0:
              image: "oven/bun:1.2.20"
              volumes:
                - "/var/cache/buildkite-bun:/root/.bun/install/cache"
              workdir: /workdir
              mount-checkout: true
              propagate-environment: true
              environment:
                - "FORCE_COLOR"
                - "CLICOLOR_FORCE"
                - "E2B_SESSION_SECRET"
                - "ORY_SDK_URL"
                - "ORY_OAUTH2_CLIENT_ID"
                - "ORY_OAUTH2_CLIENT_SECRET"
                - "ORY_OAUTH2_CLI_CLIENT_ID"
                - "ORY_OAUTH2_AUDIENCE"
                - "ORY_PROJECT_API_TOKEN"
                - "DASHBOARD_API_ADMIN_TOKEN"
                - "BILLING_API_URL"
                - "NEXT_PUBLIC_E2B_DOMAIN"
                - "NEXT_PUBLIC_POSTHOG_KEY"
                - "NEXT_PUBLIC_STRIPE_BILLING_URL"
                - "NEXT_PUBLIC_SCAN"
                - "NEXT_PUBLIC_MOCK_DATA"

  - label: ":nextjs: Build"
    key: build
    depends_on:
      - lint
      - unit
    # next build runs prebuild (scripts:check-app-env), which validates the app
    # env schema — reuse the same test env as the integration job.
    env:
      E2B_SESSION_SECRET: test-session-secret
      ORY_SDK_URL: https://test-ory.projects.oryapis.com
      ORY_OAUTH2_CLIENT_ID: test-ory-client-id
      ORY_OAUTH2_CLIENT_SECRET: test-ory-client-secret
      ORY_OAUTH2_CLI_CLIENT_ID: test-ory-cli-client-id
      ORY_OAUTH2_AUDIENCE: https://api.e2b-test.dev
      ORY_PROJECT_API_TOKEN: test-ory-project-api-token
      DASHBOARD_API_ADMIN_TOKEN: test-dashboard-admin-token
      BILLING_API_URL: https://billing.e2b-test.dev
      NEXT_PUBLIC_E2B_DOMAIN: e2b-test.dev
      NEXT_PUBLIC_POSTHOG_KEY: test-posthog-key
      NEXT_PUBLIC_STRIPE_BILLING_URL: https://test-stripe-billing.example.com
      NEXT_PUBLIC_SCAN: "0"
      NEXT_PUBLIC_MOCK_DATA: "1"
    command:
      - "bun install --frozen-lockfile"
      - "bun run build"
    plugins:
      - docker#v5.11.0:
          image: "oven/bun:1.2.20"
          volumes:
            - "/var/cache/buildkite-bun:/root/.bun/install/cache"
          workdir: /workdir
          mount-checkout: true
          propagate-environment: true
          environment:
            - "FORCE_COLOR"
            - "CLICOLOR_FORCE"
            - "E2B_SESSION_SECRET"
            - "ORY_SDK_URL"
            - "ORY_OAUTH2_CLIENT_ID"
            - "ORY_OAUTH2_CLIENT_SECRET"
            - "ORY_OAUTH2_CLI_CLIENT_ID"
            - "ORY_OAUTH2_AUDIENCE"
            - "ORY_PROJECT_API_TOKEN"
            - "DASHBOARD_API_ADMIN_TOKEN"
            - "BILLING_API_URL"
            - "NEXT_PUBLIC_E2B_DOMAIN"
            - "NEXT_PUBLIC_POSTHOG_KEY"
            - "NEXT_PUBLIC_STRIPE_BILLING_URL"
            - "NEXT_PUBLIC_SCAN"
            - "NEXT_PUBLIC_MOCK_DATA"
